name: Performance Benchmarks

# benchmarks/src times self-contained reference implementations defined inside
# each bench file, not agentic-flow (see benchmarks/README.md). This job only
# proves that the suite compiles under strict tsc and that the fast suites run.
# It produces no results file, baseline or trend data.

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Type-check and smoke-run synthetic benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: benchmarks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check (strict)
        run: npm run typecheck

      - name: Run fast suites
        run: npm run benchmark
