name: Agentic Flow Quality Gate

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentic-flow-quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: agentic-flow

jobs:
  governance:
    name: Governance and Type Safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: agentic-flow/package-lock.json
      - name: Check repair README package selection (no dependencies)
        run: node --test tests/repair/readme-package-resolution.node-test.mjs
      - run: npm ci --ignore-scripts
      - run: npx tsc -p config/tsconfig.json --skipLibCheck --noEmit
      - run: npm run test:governance

  compatibility:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: agentic-flow/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      # Optional-package integrations on each Node line (@ruvector/mincut-wasm
      # installs only on Node >= 22; Node 20 exercises the built-in fallback).
      - run: npm run test:integrations

  package:
    name: Build and Package
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: agentic-flow/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm pack --dry-run

  agent-booster:
    name: Agent Booster exact edits (built WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/agent-booster
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl -sSf https://drager.github.io/wasm-pack/installer/init.sh | sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: packages/agent-booster/package-lock.json
      - run: npm ci --ignore-scripts
      # Build the WASM from source and the JS from src/, then exercise both
      # through the public API and the CLI. Guards the 0.2.2 regression where a
      # rebuilt WASM made every edit fail and return the input unchanged.
      - run: npm run build
      - run: npm run test:exact-edits
      - run: npm test

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [governance, compatibility, package, agent-booster]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require all release checks
        env:
          GOVERNANCE: ${{ needs.governance.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          PACKAGE: ${{ needs.package.result }}
          AGENT_BOOSTER: ${{ needs.agent-booster.result }}
        run: |
          test "$GOVERNANCE" = success
          test "$COMPATIBILITY" = success
          test "$PACKAGE" = success
          test "$AGENT_BOOSTER" = success
