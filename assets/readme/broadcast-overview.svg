<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">From intent to outcome</title><desc id="desc">Conceptual four stage sequence: task intent, agent routing, execution, and feedback. Animated highlights are illustrative, not live telemetry.</desc><defs><radialGradient id="bg"><stop stop-color="#0b3039"/><stop offset="1" stop-color="#030a10"/></radialGradient><linearGradient id="mint"><stop stop-color="#b5fff0"/><stop offset="1" stop-color="#27cede"/></linearGradient></defs><style>text{font-family:Arial,sans-serif}.signal{stroke-dasharray:5 16;animation:flow 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:600px 168px;animation:orbit 32s linear infinite}@keyframes flow{to{stroke-dashoffset:-168}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.reveal{animation:reveal 10s ease-in-out infinite}.subtitle{animation:subtitle 10s ease-in-out infinite}.sweep{animation:sweep 10s linear infinite}.dial{transform-origin:600px 168px;animation:counter 24s linear infinite}.trace{stroke-dasharray:40 600;animation:trace 7s linear infinite}.lower{animation:lower 10s ease-in-out infinite}.progress{transform-origin:32px 300px;animation:progress 10s linear infinite}.chapter{animation:chapter 12s ease-in-out infinite}.focus{animation:focus 12s ease-in-out infinite}.beam{animation:beam 7s ease-in-out infinite}
@keyframes reveal{0%{opacity:.4;transform:translateX(-14px)}8%,92%{opacity:1;transform:translateX(0)}100%{opacity:.4;transform:translateX(-14px)}}
@keyframes subtitle{0%,6%{opacity:.35;transform:translateY(7px)}16%,92%{opacity:1;transform:translateY(0)}100%{opacity:.35;transform:translateY(7px)}}
@keyframes sweep{0%{transform:translateX(-800px);opacity:0}15%{opacity:.12}60%{opacity:.12}80%,100%{transform:translateX(800px);opacity:0}}
@keyframes counter{to{transform:rotate(-360deg)}}@keyframes trace{to{stroke-dashoffset:-640}}
@keyframes lower{0%,10%{transform:translateX(-12px);opacity:.3}20%,90%{transform:translateX(0);opacity:1}100%{transform:translateX(-12px);opacity:.3}}
@keyframes progress{0%{transform:scaleX(.02)}95%,100%{transform:scaleX(1)}}
@keyframes chapter{0%,22%{opacity:1}27%,95%{opacity:.18}100%{opacity:1}}
@keyframes focus{0%,22%{stroke:#a3ffea;fill:#12414a}27%,95%{stroke:#24515d;fill:#08212a}100%{stroke:#a3ffea;fill:#12414a}}
@keyframes beam{0%{transform:translateX(-110px);opacity:0}15%,70%{opacity:.8}100%{transform:translateX(110px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sweep{display:none}}
</style><rect x="1" y="1" width="798" height="398" rx="18" fill="url(#bg)" stroke="#20505b"/><text x="30" y="38" fill="#7de5d0" font-size="13" letter-spacing="3">AGENTIC FLOW / WORKFLOW EXPLAINER</text><text class="reveal" x="30" y="85" font-size="36" font-weight="700" fill="#edfffa">From intent to outcome.</text><rect class="focus" style="animation-delay:-12s" x="30" y="114" width="355" height="90" rx="12" fill="#08212a" stroke="#24515d"/><text x="50" y="148" font-size="23" fill="#b5fff0">01  INTENT</text><text x="50" y="180" font-size="19" fill="#b4cdd3">Describe the task</text><rect class="chapter" style="animation-delay:-12s" x="360" y="134" width="4" height="50" fill="#9affdf"/><rect class="focus" style="animation-delay:-9s" x="415" y="114" width="355" height="90" rx="12" fill="#08212a" stroke="#24515d"/><text x="435" y="148" font-size="23" fill="#b5fff0">02  ROUTE</text><text x="435" y="180" font-size="19" fill="#b4cdd3">Select an agent</text><rect class="chapter" style="animation-delay:-9s" x="745" y="134" width="4" height="50" fill="#9affdf"/><rect class="focus" style="animation-delay:-6s" x="30" y="226" width="355" height="90" rx="12" fill="#08212a" stroke="#24515d"/><text x="50" y="260" font-size="23" fill="#b5fff0">03  EXECUTE</text><text x="50" y="292" font-size="19" fill="#b4cdd3">Run the workflow</text><rect class="chapter" style="animation-delay:-6s" x="360" y="246" width="4" height="50" fill="#9affdf"/><rect class="focus" style="animation-delay:-3s" x="415" y="226" width="355" height="90" rx="12" fill="#08212a" stroke="#24515d"/><text x="435" y="260" font-size="23" fill="#b5fff0">04  FEEDBACK</text><text x="435" y="292" font-size="19" fill="#b4cdd3">Record the outcome</text><rect class="chapter" style="animation-delay:-3s" x="745" y="246" width="4" height="50" fill="#9affdf"/><path class="trace" d="M385 159H415M592 204V215H207V226M385 271H415" fill="none" stroke="#8ffce0" stroke-width="3"/><path class="trace" d="M30 344H770" stroke="#42bcbd"/><text class="lower" x="30" y="376" fill="#9bc9cc" font-size="17">Illustrated sequence / inspect results before relying on them</text></svg>