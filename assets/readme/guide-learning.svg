<svg xmlns="http://www.w3.org/2000/svg" width="800" height="432" viewBox="0 0 800 432" role="img" aria-labelledby="title desc"><title id="title">Inside the feedback loop</title><desc id="desc">1. Retrieve context: Recall relevant patterns and previous task outcomes.. 2. Route and execute: Select an agent and carry out the requested work.. 3. Record the outcome: Capture success, failure and task feedback.. 4. Inspect and refine: Review learning metrics before relying on improvements..</desc><defs><radialGradient id="bg"><stop stop-color="#0b3039"/><stop offset="1" stop-color="#030a10"/></radialGradient><linearGradient id="mint"><stop stop-color="#b5fff0"/><stop offset="1" stop-color="#27cede"/></linearGradient></defs><style>text{font-family:Arial,sans-serif}.signal{stroke-dasharray:5 16;animation:flow 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:600px 168px;animation:orbit 32s linear infinite}@keyframes flow{to{stroke-dashoffset:-168}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="798" height="430" rx="18" fill="url(#bg)" stroke="#20505b"/><text x="28" y="40" font-size="26" fill="#b5fff0" font-weight="700">Inside the feedback loop</text><rect x="26" y="66" width="748" height="68" rx="10" fill="#08212a" stroke="#24515d"/><circle cx="55" cy="99" r="17" fill="#123c44" stroke="#7fe4d5"/><text x="55" y="105" font-size="18" fill="#b5fff0" text-anchor="middle">1</text><text x="88" y="94" font-size="22" fill="#e5faf7" >Retrieve context</text><text x="88" y="119" font-size="17" fill="#a9cbd0" >Recall relevant patterns and previous task outcomes.</text><path class="signal" d="M55 134v14" stroke="#91e9d7" stroke-width="2"/><rect x="26" y="148" width="748" height="68" rx="10" fill="#08212a" stroke="#24515d"/><circle cx="55" cy="181" r="17" fill="#123c44" stroke="#7fe4d5"/><text x="55" y="187" font-size="18" fill="#b5fff0" text-anchor="middle">2</text><text x="88" y="176" font-size="22" fill="#e5faf7" >Route and execute</text><text x="88" y="201" font-size="17" fill="#a9cbd0" >Select an agent and carry out the requested work.</text><path class="signal" d="M55 216v14" stroke="#91e9d7" stroke-width="2"/><rect x="26" y="230" width="748" height="68" rx="10" fill="#08212a" stroke="#24515d"/><circle cx="55" cy="263" r="17" fill="#123c44" stroke="#7fe4d5"/><text x="55" y="269" font-size="18" fill="#b5fff0" text-anchor="middle">3</text><text x="88" y="258" font-size="22" fill="#e5faf7" >Record the outcome</text><text x="88" y="283" font-size="17" fill="#a9cbd0" >Capture success, failure and task feedback.</text><path class="signal" d="M55 298v14" stroke="#91e9d7" stroke-width="2"/><rect x="26" y="312" width="748" height="68" rx="10" fill="#08212a" stroke="#24515d"/><circle cx="55" cy="345" r="17" fill="#123c44" stroke="#7fe4d5"/><text x="55" y="351" font-size="18" fill="#b5fff0" text-anchor="middle">4</text><text x="88" y="340" font-size="22" fill="#e5faf7" >Inspect and refine</text><text x="88" y="365" font-size="17" fill="#a9cbd0" >Review learning metrics before relying on improvements.</text><text x="28" y="410" font-size="16" fill="#9ac2cc" >Conceptual workflow. Animation does not represent live telemetry.</text></svg>
