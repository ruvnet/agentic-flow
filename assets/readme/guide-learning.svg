<svg xmlns="http://www.w3.org/2000/svg" width="800" height="432" viewBox="0 0 800 432" role="img" aria-labelledby="title desc"><title id="title">Inside the feedback loop</title><desc id="desc">1. Retrieve context: Recall relevant patterns and previous task outcomes.. 2. Route and execute: Select an agent and carry out the requested work.. 3. Record the outcome: Capture success, failure and task feedback.. 4. Inspect and refine: Review learning metrics before relying on improvements..</desc><defs><radialGradient id="bg"><stop stop-color="#0b3039"/><stop offset="1" stop-color="#030a10"/></radialGradient><linearGradient id="mint"><stop stop-color="#b5fff0"/><stop offset="1" stop-color="#27cede"/></linearGradient></defs><style>text{font-family:Arial,sans-serif}.signal{stroke-dasharray:5 16;animation:flow 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:600px 168px;animation:orbit 32s linear infinite}@keyframes flow{to{stroke-dashoffset:-168}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.reveal{animation:reveal 10s ease-in-out infinite}.subtitle{animation:subtitle 10s ease-in-out infinite}.sweep{animation:sweep 10s linear infinite}.dial{transform-origin:600px 168px;animation:counter 24s linear infinite}.trace{stroke-dasharray:40 600;animation:trace 7s linear infinite}.lower{animation:lower 10s ease-in-out infinite}.progress{transform-origin:32px 300px;animation:progress 10s linear infinite}.chapter{animation:chapter 12s ease-in-out infinite}.focus{animation:focus 12s ease-in-out infinite}.beam{animation:beam 7s ease-in-out infinite}
@keyframes reveal{0%{opacity:.4;transform:translateX(-14px)}8%,92%{opacity:1;transform:translateX(0)}100%{opacity:.4;transform:translateX(-14px)}}
@keyframes subtitle{0%,6%{opacity:.35;transform:translateY(7px)}16%,92%{opacity:1;transform:translateY(0)}100%{opacity:.35;transform:translateY(7px)}}
@keyframes sweep{0%{transform:translateX(-800px);opacity:0}15%{opacity:.12}60%{opacity:.12}80%,100%{transform:translateX(800px);opacity:0}}
@keyframes counter{to{transform:rotate(-360deg)}}@keyframes trace{to{stroke-dashoffset:-640}}
@keyframes lower{0%,10%{transform:translateX(-12px);opacity:.3}20%,90%{transform:translateX(0);opacity:1}100%{transform:translateX(-12px);opacity:.3}}
@keyframes progress{0%{transform:scaleX(.02)}95%,100%{transform:scaleX(1)}}
@keyframes chapter{0%,22%{opacity:1}27%,95%{opacity:.18}100%{opacity:1}}
@keyframes focus{0%,22%{stroke:#a3ffea;fill:#12414a}27%,95%{stroke:#24515d;fill:#08212a}100%{stroke:#a3ffea;fill:#12414a}}
@keyframes beam{0%{transform:translateX(-110px);opacity:0}15%,70%{opacity:.8}100%{transform:translateX(110px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sweep{display:none}}
</style><rect x="1" y="1" width="798" height="430" rx="18" fill="url(#bg)" stroke="#20505b"/><text x="28" y="40" font-size="26" fill="#b5fff0" font-weight="700">Inside the feedback loop</text><rect class="focus" style="animation-delay:-12.0s" x="26" y="66" width="748" height="68" rx="10" fill="#08212a" stroke="#24515d"/><circle cx="55" cy="99" r="17" fill="#123c44" stroke="#7fe4d5"/><text x="55" y="105" font-size="18" fill="#b5fff0" text-anchor="middle">1</text><text x="88" y="94" font-size="22" fill="#e5faf7" >Retrieve context</text><text x="88" y="119" font-size="17" fill="#a9cbd0" >Recall relevant patterns and previous task outcomes.</text><path class="signal" d="M55 134v14" stroke="#91e9d7" stroke-width="2"/><rect class="focus" style="animation-delay:-9.0s" x="26" y="148" width="748" height="68" rx="10" fill="#08212a" stroke="#24515d"/><circle cx="55" cy="181" r="17" fill="#123c44" stroke="#7fe4d5"/><text x="55" y="187" font-size="18" fill="#b5fff0" text-anchor="middle">2</text><text x="88" y="176" font-size="22" fill="#e5faf7" >Route and execute</text><text x="88" y="201" font-size="17" fill="#a9cbd0" >Select an agent and carry out the requested work.</text><path class="signal" d="M55 216v14" stroke="#91e9d7" stroke-width="2"/><rect class="focus" style="animation-delay:-6.0s" x="26" y="230" width="748" height="68" rx="10" fill="#08212a" stroke="#24515d"/><circle cx="55" cy="263" r="17" fill="#123c44" stroke="#7fe4d5"/><text x="55" y="269" font-size="18" fill="#b5fff0" text-anchor="middle">3</text><text x="88" y="258" font-size="22" fill="#e5faf7" >Record the outcome</text><text x="88" y="283" font-size="17" fill="#a9cbd0" >Capture success, failure and task feedback.</text><path class="signal" d="M55 298v14" stroke="#91e9d7" stroke-width="2"/><rect class="focus" style="animation-delay:-3.0s" x="26" y="312" width="748" height="68" rx="10" fill="#08212a" stroke="#24515d"/><circle cx="55" cy="345" r="17" fill="#123c44" stroke="#7fe4d5"/><text x="55" y="351" font-size="18" fill="#b5fff0" text-anchor="middle">4</text><text x="88" y="340" font-size="22" fill="#e5faf7" >Inspect and refine</text><text x="88" y="365" font-size="17" fill="#a9cbd0" >Review learning metrics before relying on improvements.</text><text x="28" y="410" font-size="16" fill="#9ac2cc" >Conceptual workflow. Animation does not represent live telemetry.</text><rect class="chapter" style="animation-delay:-12.0s" x="756" y="81" width="4" height="38" rx="2" fill="#9affdf"/><rect class="chapter" style="animation-delay:-9.0s" x="756" y="163" width="4" height="38" rx="2" fill="#9affdf"/><rect class="chapter" style="animation-delay:-6.0s" x="756" y="245" width="4" height="38" rx="2" fill="#9affdf"/><rect class="chapter" style="animation-delay:-3.0s" x="756" y="327" width="4" height="38" rx="2" fill="#9affdf"/></svg>
