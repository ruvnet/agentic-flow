<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-labelledby="title desc"><title id="title">Agentic Flow</title><desc id="desc">Task routing, agent execution and adaptive memory. Animated orbital agent network.</desc><defs><radialGradient id="bg"><stop stop-color="#0b3039"/><stop offset="1" stop-color="#030a10"/></radialGradient><linearGradient id="mint"><stop stop-color="#b5fff0"/><stop offset="1" stop-color="#27cede"/></linearGradient></defs><style>text{font-family:Arial,sans-serif}.signal{stroke-dasharray:5 16;animation:flow 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:600px 168px;animation:orbit 32s linear infinite}@keyframes flow{to{stroke-dashoffset:-168}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="798" height="318" rx="18" fill="url(#bg)" stroke="#20505b"/><text x="32" y="45" font-size="14" fill="#81dace" letter-spacing="2">RUVNET / AGENT ORCHESTRATION</text><text x="30" y="107" font-size="54" fill="url(#mint)" font-weight="700">Agentic Flow</text><text x="32" y="148" font-size="23" fill="#e5faf7" >From a task to coordinated action.</text><text x="32" y="181" font-size="20" fill="#aacbd1" >Route. Execute. Remember. Improve.</text><circle cx="600" cy="168" r="64" fill="none" stroke="#216473"/><circle cx="600" cy="168" r="100" fill="none" stroke="#216473"/><circle cx="600" cy="168" r="133" fill="none" stroke="#216473"/><g class="orbit"><path d="M600 168L733.0 168.0" stroke="#288a94" opacity=".55"/><circle cx="733.0" cy="168.0" r="5" fill="#99f3df"/><path d="M600 168L715.2 234.5" stroke="#288a94" opacity=".55"/><circle cx="715.2" cy="234.5" r="5" fill="#99f3df"/><path d="M600 168L666.5 283.2" stroke="#288a94" opacity=".55"/><circle cx="666.5" cy="283.2" r="5" fill="#99f3df"/><path d="M600 168L600.0 301.0" stroke="#288a94" opacity=".55"/><circle cx="600.0" cy="301.0" r="5" fill="#99f3df"/><path d="M600 168L533.5 283.2" stroke="#288a94" opacity=".55"/><circle cx="533.5" cy="283.2" r="5" fill="#99f3df"/><path d="M600 168L484.8 234.5" stroke="#288a94" opacity=".55"/><circle cx="484.8" cy="234.5" r="5" fill="#99f3df"/><path d="M600 168L467.0 168.0" stroke="#288a94" opacity=".55"/><circle cx="467.0" cy="168.0" r="5" fill="#99f3df"/><path d="M600 168L484.8 101.5" stroke="#288a94" opacity=".55"/><circle cx="484.8" cy="101.5" r="5" fill="#99f3df"/><path d="M600 168L533.5 52.8" stroke="#288a94" opacity=".55"/><circle cx="533.5" cy="52.8" r="5" fill="#99f3df"/><path d="M600 168L600.0 35.0" stroke="#288a94" opacity=".55"/><circle cx="600.0" cy="35.0" r="5" fill="#99f3df"/><path d="M600 168L666.5 52.8" stroke="#288a94" opacity=".55"/><circle cx="666.5" cy="52.8" r="5" fill="#99f3df"/><path d="M600 168L715.2 101.5" stroke="#288a94" opacity=".55"/><circle cx="715.2" cy="101.5" r="5" fill="#99f3df"/></g><circle class="pulse" cx="600" cy="168" r="38" fill="#103b44" stroke="#75e8d6"/><text x="600" y="175" font-size="20" fill="#b5fff0" text-anchor="middle">FLOW</text><path class="signal" d="M32 225H438" stroke="#6cebd8" fill="none"/><text x="32" y="276" font-size="17" fill="#9fbec8" >CLI  /  MCP  /  AgentDB  /  RuVector</text></svg>
