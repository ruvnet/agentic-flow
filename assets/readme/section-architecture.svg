<svg xmlns="http://www.w3.org/2000/svg" width="800" height="92" viewBox="0 0 800 92" role="img" aria-labelledby="title desc"><title id="title">ARCHITECTURE</title><desc id="desc">Follow context through the system</desc><defs><radialGradient id="bg"><stop stop-color="#0b3039"/><stop offset="1" stop-color="#030a10"/></radialGradient><linearGradient id="mint"><stop stop-color="#b5fff0"/><stop offset="1" stop-color="#27cede"/></linearGradient></defs><style>text{font-family:Arial,sans-serif}.signal{stroke-dasharray:5 16;animation:flow 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:600px 168px;animation:orbit 32s linear infinite}@keyframes flow{to{stroke-dashoffset:-168}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.reveal{animation:reveal 10s ease-in-out infinite}.subtitle{animation:subtitle 10s ease-in-out infinite}.sweep{animation:sweep 10s linear infinite}.dial{transform-origin:600px 168px;animation:counter 24s linear infinite}.trace{stroke-dasharray:40 600;animation:trace 7s linear infinite}.lower{animation:lower 10s ease-in-out infinite}.progress{transform-origin:32px 300px;animation:progress 10s linear infinite}.chapter{animation:chapter 12s ease-in-out infinite}.focus{animation:focus 12s ease-in-out infinite}.beam{animation:beam 7s ease-in-out infinite}
@keyframes reveal{0%{opacity:.4;transform:translateX(-14px)}8%,92%{opacity:1;transform:translateX(0)}100%{opacity:.4;transform:translateX(-14px)}}
@keyframes subtitle{0%,6%{opacity:.35;transform:translateY(7px)}16%,92%{opacity:1;transform:translateY(0)}100%{opacity:.35;transform:translateY(7px)}}
@keyframes sweep{0%{transform:translateX(-800px);opacity:0}15%{opacity:.12}60%{opacity:.12}80%,100%{transform:translateX(800px);opacity:0}}
@keyframes counter{to{transform:rotate(-360deg)}}@keyframes trace{to{stroke-dashoffset:-640}}
@keyframes lower{0%,10%{transform:translateX(-12px);opacity:.3}20%,90%{transform:translateX(0);opacity:1}100%{transform:translateX(-12px);opacity:.3}}
@keyframes progress{0%{transform:scaleX(.02)}95%,100%{transform:scaleX(1)}}
@keyframes chapter{0%,22%{opacity:1}27%,95%{opacity:.18}100%{opacity:1}}
@keyframes focus{0%,22%{stroke:#a3ffea;fill:#12414a}27%,95%{stroke:#24515d;fill:#08212a}100%{stroke:#a3ffea;fill:#12414a}}
@keyframes beam{0%{transform:translateX(-110px);opacity:0}15%,70%{opacity:.8}100%{transform:translateX(110px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sweep{display:none}}
</style><rect x="1" y="1" width="798" height="90" rx="18" fill="url(#bg)" stroke="#20505b"/><text x="26" y="39" font-size="19" fill="#70dfd0" >13</text><text class="reveal" x="78" y="39" font-size="24" fill="#e5faf7" font-weight="700">ARCHITECTURE</text><text class="subtitle" x="78" y="68" font-size="17" fill="#a6c8ce" >Follow context through the system</text><path d="M660 46H770" stroke="#265561"/><path class="signal" d="M660 46H770" stroke="#81e9da"/><circle class="pulse" cx="650" cy="46" r="6" fill="#73e8d5"/><path class="trace" d="M22 82H778" stroke="#65daca" stroke-width="2"/><path class="beam" d="M708 24v44" stroke="#b2ffec" opacity=".6"/></svg>
