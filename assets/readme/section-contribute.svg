<svg xmlns="http://www.w3.org/2000/svg" width="800" height="92" viewBox="0 0 800 92" role="img" aria-labelledby="title desc"><title id="title">CONTRIBUTE</title><desc id="desc">Build, test and share improvements</desc><defs><radialGradient id="bg"><stop stop-color="#0b3039"/><stop offset="1" stop-color="#030a10"/></radialGradient><linearGradient id="mint"><stop stop-color="#b5fff0"/><stop offset="1" stop-color="#27cede"/></linearGradient></defs><style>text{font-family:Arial,sans-serif}.signal{stroke-dasharray:5 16;animation:flow 8s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.orbit{transform-origin:600px 168px;animation:orbit 32s linear infinite}@keyframes flow{to{stroke-dashoffset:-168}}@keyframes pulse{50%{opacity:.4}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="798" height="90" rx="18" fill="url(#bg)" stroke="#20505b"/><text x="26" y="39" font-size="19" fill="#70dfd0" >14</text><text x="78" y="39" font-size="24" fill="#e5faf7" font-weight="700">CONTRIBUTE</text><text x="78" y="68" font-size="17" fill="#a6c8ce" >Build, test and share improvements</text><path d="M660 46H770" stroke="#265561"/><path class="signal" d="M660 46H770" stroke="#81e9da"/><circle class="pulse" cx="650" cy="46" r="6" fill="#73e8d5"/></svg>
